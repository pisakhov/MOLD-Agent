<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLD Agent — Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }</style>
</head>
<body class="bg-white text-neutral-900 min-h-screen">
<header class="border-b border-neutral-200">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="font-semibold tracking-tight">MOLD Agent<span class="text-neutral-400"> · Lab</span></div>
        <nav class="flex items-center gap-6 text-sm">
            <a href="/" class="text-neutral-500 hover:text-neutral-900">Lab</a>
            <a href="/settings" class="font-medium">Settings</a>
            <a href="https://github.com/pisakhov/MOLD-Agent" target="_blank" class="text-neutral-500 hover:text-neutral-900">GitHub</a>
        </nav>
    </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-10 space-y-10">
    <div>
        <h1 class="text-2xl font-semibold tracking-tight">Settings</h1>
        <p class="text-neutral-500 text-sm mt-1">Providers, models, and the fallback chain used by the attention-mold runner.</p>
    </div>

    <section>
        <h2 class="text-lg font-semibold tracking-tight mb-4">Providers</h2>
        <div id="providersList" class="space-y-2 mb-4"></div>
        <details class="border border-neutral-200 rounded-xl p-5">
            <summary class="cursor-pointer text-sm font-medium">+ Add provider</summary>
            <form id="providerForm" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
                <input name="name" placeholder="Display name" required class="px-3 py-2 rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none">
                <select name="provider_type" class="px-3 py-2 rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none">
                    <option value="openai">OpenAI / compatible</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="google">Google Gemini</option>
                </select>
                <input name="base_url" placeholder="Base URL (optional)" class="px-3 py-2 rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none md:col-span-2">
                <input name="api_key" type="password" placeholder="API key" required class="px-3 py-2 rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none md:col-span-2">
                <button type="submit" class="md:col-span-2 py-2 rounded-lg bg-neutral-900 text-white font-medium hover:bg-neutral-700 transition-colors">Save provider</button>
            </form>
        </details>
    </section>

    <section>
        <h2 class="text-lg font-semibold tracking-tight mb-4">Models</h2>
        <div id="modelsList" class="space-y-2 mb-4"></div>
        <details class="border border-neutral-200 rounded-xl p-5">
            <summary class="cursor-pointer text-sm font-medium">+ Add model manually</summary>
            <form id="modelForm" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
                <select name="provider_id" id="modelProvider" required class="px-3 py-2 rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none md:col-span-2"></select>
                <input name="display_name" placeholder="Display name" required class="px-3 py-2 rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none">
                <input name="model_id" placeholder="Model ID" required class="px-3 py-2 rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none">
                <label class="flex items-center gap-2 text-sm text-neutral-600"><input name="is_default" type="checkbox"> Default</label>
                <label class="flex items-center gap-2 text-sm text-neutral-600"><input name="enabled" type="checkbox" checked> Enabled</label>
                <button type="submit" class="md:col-span-2 py-2 rounded-lg bg-neutral-900 text-white font-medium hover:bg-neutral-700 transition-colors">Save model</button>
            </form>
        </details>
    </section>

    <section>
        <h2 class="text-lg font-semibold tracking-tight mb-1">Fallback chain</h2>
        <p class="text-neutral-500 text-sm mb-4">The MOLD runner tries models in order. Keep this short to avoid agent fatigue.</p>
        <div class="flex items-center gap-3 mb-3">
            <select id="chainAdd" class="px-3 py-2 rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none flex-1 text-sm"></select>
            <button id="saveChain" class="px-4 py-2 rounded-lg bg-neutral-900 text-white text-sm font-medium hover:bg-neutral-700 transition-colors">Save chain</button>
        </div>
        <div id="chainList" class="space-y-2"></div>
    </section>
</main>

<div id="modelModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-neutral-900/40" onclick="closeModal()"></div>
    <div class="relative bg-white rounded-xl border border-neutral-200 shadow-xl w-full max-w-md max-h-[80vh] flex flex-col">
        <div class="px-6 py-4 border-b border-neutral-200 flex items-center justify-between">
            <h3 id="modalTitle" class="font-semibold tracking-tight">Detect models</h3>
            <button onclick="closeModal()" class="text-neutral-400 hover:text-neutral-900 text-xl leading-none">&times;</button>
        </div>
        <div class="px-6 py-3 border-b border-neutral-200 flex items-center gap-3">
            <input id="modelFilter" placeholder="Filter models…" oninput="renderModalList()" class="flex-1 px-3 py-1.5 text-sm rounded-lg border border-neutral-300 focus:border-neutral-900 focus:outline-none">
            <label class="flex items-center gap-1.5 text-sm text-neutral-600 shrink-0"><input type="checkbox" id="modalSelectAll" onchange="toggleSelectAll(this.checked)"> Select all</label>
        </div>
        <div id="modalList" class="overflow-y-auto px-6 py-3 space-y-0.5 flex-1"></div>
        <div class="px-6 py-4 border-t border-neutral-200 flex items-center justify-between">
            <span id="modalCount" class="text-xs text-neutral-400"></span>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="text-sm px-4 py-1.5 rounded-lg border border-neutral-300 hover:bg-neutral-50 transition-colors">Cancel</button>
                <button onclick="addSelectedModels()" class="text-sm px-4 py-1.5 rounded-lg bg-neutral-900 text-white font-medium hover:bg-neutral-700 transition-colors">Add selected</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/settings.js"></script>
</body>
</html>
